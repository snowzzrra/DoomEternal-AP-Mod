name: DOOM mod smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DoomEternal-AP-Mod
    env:
      # main pairs with the doom_eternal APWorld branch; other branches use the APWorld branch of the same name
      APWORLD_REF: ${{ (github.base_ref || github.ref_name) == 'main' && 'doom_eternal' || (github.base_ref || github.ref_name) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: DoomEternal-AP-Mod
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ env.APWORLD_REF }}
          path: Archipelago
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12.10'}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0
      - name: Install smoke dependencies
        run: |
          python -m pip install --requirement requirements-launcher.txt
          python -m pip install --requirement requirements-ci.txt
      - name: Compile Python
        run: python -m compileall -q doom_eap tools/content tools/validation
      - name: Check Python function complexity (development)
        run: python -m tools.validation.function_complexity
      - name: Validate authorial content
        run: python -m tools.validation.authorial --check-authorial
      - name: Validate frozen room resources
        run: python -m tools.release.prebuilt_room_resources --check
      - name: Validate packaged options schema
        run: python -c "from pathlib import Path; from doom_eap.content.options_foundation import load_options_schema; load_options_schema(Path('data/options_schema.json'))"
      - name: Behavioral contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --disable-warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Report service contract without external writes
        run: node tools/report_backend/test_server.cjs
      - name: Check whitespace
        run: git diff --check

  native-client:
    name: Windows native-client gate
    runs-on: windows-2022
    env:
      CORE_REPO: snowzzrra/Sentinel-Core
      CORE_REF: 86a04096e4083a8ae5e8ee722048fe7fcad03a3a
      SENTINEL_CORE_SOURCE: ${{ github.workspace }}/Sentinel-Core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Core source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: Sentinel-Core
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12.10'}
      - name: Locate MSVC x64
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC x64 is required' }
          "SC_VCVARS=$installation\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Verify native-client contracts without skips
        shell: cmd
        run: |
          call "%SC_VCVARS%"
          if errorlevel 1 exit /b 1
          cmake -S Sentinel-Core -B Sentinel-Core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          if not exist Sentinel-Core\build\generated\sentinel_version.h exit /b 1
          python -m pip install --requirement requirements-ci.txt
          if errorlevel 1 exit /b 1
          set "DELIVERY_TESTS="
          if exist tests\test_delivery_scenarios.py set "DELIVERY_TESTS=tests/test_delivery_scenarios.py"
          python -m pytest tests/test_native_queue.py tests/test_ap_client_timing.py %DELIVERY_TESTS% -q --junitxml=native-client-results.xml
          if errorlevel 1 exit /b 1
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('native-client-results.xml').getroot(); assert list(root.iter('testcase')), 'Native-client gate collected zero tests'; assert not [node for node in root.iter('skipped') if node.get('type') != 'pytest.xfail'], 'Native-client gate contains unexpected skipped tests'"
