name: DOOM mod smoke
on: [push, pull_request]
permissions: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q launcher_core.py launcher_cli.py tools/content tools/validation
      - run: python -m tools.content.compile_content_catalog --check
      - run: python -m pytest -q tests
      - run: git diff --check
