name: DOOM mod smoke
on: [push, pull_request]
permissions: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install smoke dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Compile Python
        run: python -m compileall -q bridge_client.py deathlink_receive.py launcher_core.py launcher_cli.py launcher_supervisor.py tools/content tools/validation
      - name: Validate authorial content
        run: python -m tools.validation.authorial --check-authorial
      - name: Run focused contracts
        run: python -m pytest -q tests
      - name: Check whitespace
        run: git diff --check
