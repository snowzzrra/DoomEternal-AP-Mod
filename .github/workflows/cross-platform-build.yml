name: DOOM Eternal AP Cross-Platform Build

'on':
  workflow_dispatch:
    inputs:
      mod_ref:
        description: 'Git ref or commit SHA for DoomEternal-AP-Mod'
        required: true
        default: 'main'
        type: string
      apworld_ref:
        description: 'Git ref or commit SHA for Archipelago / APWorld'
        required: true
        default: 'doom_eternal'
        type: string
      version_label:
        description: 'Release version label (e.g. v0.5.2)'
        required: true
        default: 'v0.5.2'
        type: string

permissions:
  contents: read

jobs:
  resolve-metadata:
    name: Resolve Source Metadata
    runs-on: ubuntu-latest
    outputs:
      mod_resolved_sha: ${{ steps.resolve.outputs.mod_resolved_sha }}
      short_mod_sha: ${{ steps.resolve.outputs.short_mod_sha }}
      apworld_resolved_sha: ${{ steps.resolve.outputs.apworld_resolved_sha }}
      version_label: ${{ steps.resolve.outputs.version_label }}
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ inputs.mod_ref }}
          path: mod_repo

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ inputs.apworld_ref }}
          path: apworld_repo

      - name: Resolve Commit SHAs
        id: resolve
        run: |
          MOD_SHA=$(git -C mod_repo rev-parse HEAD)
          SHORT_MOD_SHA=$(git -C mod_repo rev-parse --short=8 HEAD)
          APWORLD_SHA=$(git -C apworld_repo rev-parse HEAD)
          echo "mod_resolved_sha=$MOD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_mod_sha=$SHORT_MOD_SHA" >> "$GITHUB_OUTPUT"
          echo "apworld_resolved_sha=$APWORLD_SHA" >> "$GITHUB_OUTPUT"
          echo "version_label=${{ inputs.version_label }}" >> "$GITHUB_OUTPUT"
          echo "=== RESOLVED BUILD METADATA ==="
          echo "MOD Ref: ${{ inputs.mod_ref }} -> $MOD_SHA ($SHORT_MOD_SHA)"
          echo "APWorld Ref: ${{ inputs.apworld_ref }} -> $APWORLD_SHA"
          echo "Version: ${{ inputs.version_label }}"

  preflight:
    name: Portable Release Preflight & Verified Room Resources
    needs: resolve-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}
          path: DoomEternal-AP-Mod

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}
          path: Archipelago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            DoomEternal-AP-Mod/requirements-launcher.txt
            DoomEternal-AP-Mod/requirements-ci.txt

      - name: Install Qt Runtime Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install Python Dependencies
        run: |
          cd DoomEternal-AP-Mod
          python -m pip install --upgrade pip
          python -m pip install -r requirements-launcher.txt
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Static Undefined Name Check (F821/F822/F823)
        run: |
          cd DoomEternal-AP-Mod
          python -m ruff check --select F821,F822,F823 doom_eap tools/release

      - name: Standalone Runtime Import Preflight
        timeout-minutes: 1
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.release.verify_launcher_runtime --archipelago-source ../Archipelago

      - name: Aggregate CI Preflight
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.release.ci_preflight --archipelago-source ../Archipelago --repo-root .

      - name: Validate Authorial Content
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.validation.authorial --check-authorial

      - name: Verify APWorld Projections & Content Synchronization
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.content.compile_options_schema --check
          python -m tools.content.compile_start_inventory_catalog --check
          python -m tools.content.compile_content_catalog --check --source-only

      - name: Validate and Export Hermetic Prebuilt Room Resources
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.release.prebuilt_room_resources --export-dir build/release/client/resources

      - name: Upload Room Resources Artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-resources-artifact
          path: DoomEternal-AP-Mod/build/release/client/resources/
          retention-days: 1

  build-apworld:
    name: Package APWorld
    needs: [resolve-metadata, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}
          path: DoomEternal-AP-Mod

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}
          path: Archipelago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package doometernal.apworld
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.release.apworld_cache \
            --output build/artifacts/doometernal.apworld \
            --archipelago-source ../Archipelago \
            --archipelago-python "$(command -v python)"

      - name: Upload APWorld Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apworld-artifact
          path: DoomEternal-AP-Mod/build/artifacts/doometernal.apworld
          retention-days: 1

  build-native-support:
    name: Build Native Client (MSVC x64)
    needs: [resolve-metadata, preflight]
    runs-on: windows-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and Validate Native Client
        shell: pwsh
        run: .\scripts\build\client_windows.ps1 -OutputDir build\release\build\client

      - name: Verify Native Binaries
        shell: pwsh
        run: |
          $client = 'build/release/build/client/ap_client.exe'
          if (-not (Test-Path -LiteralPath $client)) { throw "Native client was not produced: $client" }
          $clientBytes = [IO.File]::ReadAllBytes($client)
          if ($clientBytes.Length -lt 2 -or $clientBytes[0] -ne 0x4d -or $clientBytes[1] -ne 0x5a) { throw "Invalid native client: $client" }
          New-Item -ItemType Directory -Force build/artifacts/client | Out-Null
          Copy-Item $client build/artifacts/client/
          if (Test-Path -LiteralPath 'build/release/build/client/save_death_probe.exe') { Copy-Item build/release/build/client/save_death_probe.exe build/artifacts/client/ }

      - name: Upload Native Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-support-artifact
          path: build/artifacts/client
          retention-days: 1

  build-linux-launcher:
    name: Build Linux Standalone Launcher
    needs: [resolve-metadata, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}
          path: Archipelago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Qt Runtime Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - name: Install Linux Launcher Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-launcher.txt

      - name: Build Linux Frozen Launcher
        run: |
          mkdir -p build/release
          python3 -m tools.release.build_launcher \
            --output-dir build/release \
            --archipelago-source Archipelago \
            --name DoomEternalArchipelagoLauncher

      - name: Validate Linux Frozen Launcher
        run: |
          test -f build/release/DoomEternalArchipelagoLauncher
          test -x build/release/DoomEternalArchipelagoLauncher
          test "$(dd if=build/release/DoomEternalArchipelagoLauncher bs=4 count=1 2>/dev/null)" = $'\x7fELF'
          echo "--> Running frozen Linux launcher self-test..."
          timeout 30s build/release/DoomEternalArchipelagoLauncher --self-test
          mkdir -p build/artifacts/linux
          cp build/release/DoomEternalArchipelagoLauncher build/artifacts/linux/

      - name: Upload Linux Launcher Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-launcher-artifact
          path: build/artifacts/linux/DoomEternalArchipelagoLauncher
          retention-days: 1

  build-windows-launcher:
    name: Build Windows Standalone Launcher
    needs: [resolve-metadata, preflight]
    runs-on: windows-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}
          path: Archipelago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Windows Launcher Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-launcher.txt
          python -m pip install -r requirements-ci.txt

      - name: Windows Filesystem Corrective Gate
        run: |
          python -m pytest tests/test_install_workflow.py::TestWindowsFilesystemCorrective -q

      - name: Build Windows Frozen Launcher
        run: |
          python -m tools.release.build_launcher --output-dir build/release --archipelago-source Archipelago --name DoomEternalArchipelagoLauncher

      - name: Validate Windows Frozen Launcher
        shell: pwsh
        timeout-minutes: 1
        run: |
          $launcher = 'build/release/DoomEternalArchipelagoLauncher.exe'
          if (-not (Test-Path -LiteralPath $launcher)) { throw "Windows launcher was not produced" }
          $launcherBytes = [IO.File]::ReadAllBytes($launcher)
          if ($launcherBytes.Length -lt 2 -or $launcherBytes[0] -ne 0x4d -or $launcherBytes[1] -ne 0x5a) { throw "Invalid Windows launcher" }
          Write-Output '--> Running frozen Windows launcher self-test...'
          & build/release/DoomEternalArchipelagoLauncher.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows launcher self-test failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force build/artifacts/windows | Out-Null
          Copy-Item $launcher build/artifacts/windows/

      - name: Upload Windows Launcher Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-artifact
          path: build/artifacts/windows/DoomEternalArchipelagoLauncher.exe
          retention-days: 1

  consolidate-handoff:
    name: Consolidate Build Handoff Bundle
    needs:
      - resolve-metadata
      - preflight
      - build-apworld
      - build-native-support
      - build-linux-launcher
      - build-windows-launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}
          path: DoomEternal-AP-Mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Handoff Directory Structure
        run: |
          mkdir -p DoomEAP-build-handoff/linux
          mkdir -p DoomEAP-build-handoff/windows
          mkdir -p DoomEAP-build-handoff/shared/client
          mkdir -p DoomEAP-build-handoff/shared/resources

      - name: Download APWorld Artifact
        uses: actions/download-artifact@v4
        with:
          name: apworld-artifact
          path: DoomEAP-build-handoff/shared

      - name: Download Native Support Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-support-artifact
          path: DoomEAP-build-handoff/shared/client

      - name: Download Linux Launcher Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-launcher-artifact
          path: DoomEAP-build-handoff/linux

      - name: Download Windows Launcher Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-launcher-artifact
          path: DoomEAP-build-handoff/windows

      - name: Download Room Resources Artifact
        uses: actions/download-artifact@v4
        with:
          name: room-resources-artifact
          path: DoomEAP-build-handoff/shared/resources

      - name: Generate Manifest and Checksums
        run: |
          cd DoomEternal-AP-Mod
          python -m tools.release.handoff \
            --root ../DoomEAP-build-handoff \
            --version '${{ needs.resolve-metadata.outputs.version_label }}' \
            --mod-ref '${{ github.event.inputs.mod_ref }}' \
            --mod-sha '${{ needs.resolve-metadata.outputs.mod_resolved_sha }}' \
            --apworld-ref '${{ github.event.inputs.apworld_ref }}' \
            --apworld-sha '${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}' \
            --platform both

      - name: Restore Linux Launcher Executable Bit
        run: |
          cd DoomEAP-build-handoff
          chmod +x linux/DoomEternalArchipelagoLauncher
          test -x linux/DoomEternalArchipelagoLauncher

      - name: Upload Cross-Platform Build Handoff Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomEAP-crossplatform-build-${{ needs.resolve-metadata.outputs.version_label }}-${{ needs.resolve-metadata.outputs.short_mod_sha }}
          path: DoomEAP-build-handoff
          retention-days: 14

  assemble-release:
    name: Assemble Final Public Release Packages
    needs:
      - resolve-metadata
      - preflight
      - consolidate-handoff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOD repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-Mod
          ref: ${{ needs.resolve-metadata.outputs.mod_resolved_sha }}
          path: DoomEternal-AP-Mod

      - name: Checkout APWorld repository
        uses: actions/checkout@v4
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}
          path: Archipelago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            DoomEternal-AP-Mod/requirements-launcher.txt
            DoomEternal-AP-Mod/requirements-ci.txt

      - name: Install Python Dependencies
        run: |
          cd DoomEternal-AP-Mod
          python -m pip install --upgrade pip
          python -m pip install -r requirements-launcher.txt
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Download Build Handoff Artifact
        uses: actions/download-artifact@v4
        with:
          name: DoomEAP-crossplatform-build-${{ needs.resolve-metadata.outputs.version_label }}-${{ needs.resolve-metadata.outputs.short_mod_sha }}
          path: handoff

      - name: Download Room Resources Artifact
        uses: actions/download-artifact@v4
        with:
          name: room-resources-artifact
          path: room_resources

      - name: Assemble Final Release ZIPs
        run: |
          cd DoomEternal-AP-Mod
          python3 scripts/release/assemble_ci_artifact.py \
            --handoff ../handoff \
            --room-resources-dir ../room_resources \
            --output-dir dist \
            --version "${{ needs.resolve-metadata.outputs.version_label }}" \
            --expect-mod-sha "${{ needs.resolve-metadata.outputs.mod_resolved_sha }}" \
            --expect-apworld-sha "${{ needs.resolve-metadata.outputs.apworld_resolved_sha }}" \
            --repo-root .

      - name: Validate Release Packages & Checksums
        run: |
          cd DoomEternal-AP-Mod/dist
          test -f "DoomEternalArchipelago-${{ needs.resolve-metadata.outputs.version_label }}-windows-x86_64.zip"
          test -f "DoomEternalArchipelago-${{ needs.resolve-metadata.outputs.version_label }}-linux-x86_64.zip"
          test -f "SHA256SUMS.txt"
          sha256sum -c SHA256SUMS.txt
          echo "=== RELEASE PACKAGES VALIDATED SUCCESSFULLY ==="
          ls -lh

      - name: Upload Final Public Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomEAP-release-${{ needs.resolve-metadata.outputs.version_label }}-${{ needs.resolve-metadata.outputs.short_mod_sha }}
          path: DoomEternal-AP-Mod/dist/
          retention-days: 14
