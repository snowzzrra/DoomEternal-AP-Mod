name: Authorial integration audit
on:
  workflow_dispatch:
    inputs:
      apworld_ref:
        description: Exact APWorld ref to audit with this checkout
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: mod
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: snowzzrra/DoomEternal-AP-World
          ref: ${{ inputs.apworld_ref }}
          path: Archipelago
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Install audit dependencies
        working-directory: mod
        run: python -m pip install -r requirements-ci.txt
      - name: Validate producers and accepted contracts
        working-directory: mod
        run: python -m tools.validation.validate_data --apworld-root ../Archipelago/worlds/doometernal
