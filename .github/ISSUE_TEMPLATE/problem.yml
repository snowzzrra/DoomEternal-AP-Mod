name: "🐛 Report a Problem"
description: Something went wrong while installing, launching, generating, connecting, or playing DOOM Eternal Archipelago.
title: "[Bug] "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Briefly describe what went wrong. One or two sentences is usually enough.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you doing when it happened?
      description: 'For example: "I entered The Holt", "I received an item", "I clicked Repair", or "I returned from TAG1 to the Base Campaign".'
  - type: textarea
    id: support-report
    attributes:
      label: Support Report
      description: |
        **Drag the Support Report generated by the DoomEAP Launcher here.**
        Use Help → Report a Problem in the launcher to create it.
        It contains the technical information maintainers usually need, so you do not need to manually list your version, options, operating system, map, logs, or installation details.
        If the launcher could not generate one, you can still submit this issue.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I attached the DoomEAP Support Report, or the launcher was unable to generate one.
          required: true
        - label: I have not included an Archipelago room password, authentication token, or other secret.
          required: true
