[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "build",
    "release",
    "dist",
    "gameresources",
    "vanillamaps",
    "vanilla_decls",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PIE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: pure/unit-level contract test",
    "catalog: JSON/catalog contract test",
    "generated: generated-content inspection without map generation",
    "integration: real map generation or patching",
    "slow: broad or build-like regression",
    "apworld: complete APWorld import, seed, or fill",
    "legacy_generated: isolated pre-catalog generator regression",
]
